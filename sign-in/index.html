<!doctype html>
<html lang="kor">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>

    <link rel="stylesheet" href="../css/sign-in.css" />
  </head>
  <body class="form-frame">
    <header>
      <div class="logo-frame">
        <a href="../index.html" class="logo">
          <img
            src="../images/판다 얼굴.png"
            alt="판다마켓 로고"
            class="logo-img"
          />
          <span class="logo-text">판다마켓</span>
        </a>
      </div>
    </header>
    <main>
      <div id="form-gap">
        <div class="form-group">
          <label for="email">이메일</label>

          <input type="email" id="email" placeholder="이메일을 입력하세요" />
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>

          <input
            type="password"
            id="password"
            placeholder="비밀번호를 입력하세요."
          />
        </div>
        <div>
          <button class="btn-login">로그인</button>
        </div>

        <div class="social-login">
          간편 로그인하기

          <a href="https://www.google.com" target="_blank"
            ><img src="/images/google.png" alt="구글 로그인"
          /></a>
          <a href="https://www.kakao.com" target="_blank"
            ><img src="/images/kakao.png" alt="카카오 로그인"
          /></a>
        </div>
        <div>
          <span>판다마켓이 처음이신가요 ?</span>
          <a href="../sign-up/index.html">회원가입</a>
        </div>
      </div>
    </main>
  </body>
</html>
