<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/var.css" />
    <link rel="stylesheet" href="../css/sign-in.css" />
  </head>
  <body class="form-frame">
    <header>
      <div class="logo-frame">
        <a href="../index.html" class="logo">
          <img
            src="../images/판다 얼굴.png"
            alt="판다마켓 로고"
            class="logo-img"
          />
          <span class="logo-text">판다마켓</span>
        </a>
      </div>
    </header>
    <main>
      <div id="form-gap">
        <div class="form-group">
          <label for="email">이메일</label>

          <input type="email" id="email" placeholder="이메일을 입력하세요" />
        </div>
        <p id="email-error">잘못된 이메일 형식입니다.</p>
        <label for="password">비밀번호</label>
        <div class="password-confirm">
          <input
            type="password"
            id="password"
            placeholder="비밀번호를 입력하세요."
          />
          <img src="../images/eyes.svg" alt="비밀번호 보기" class="eyes" />
        </div>
        <p id="password-error">비밀번호를 8자 이상 입력해주세요.</p>
        <div>
          <button class="btn-login">로그인</button>
        </div>

        <div class="social-login">
          간편 로그인하기
          <div class="g-k">
            <a href="https://www.google.com" target="_blank"
              ><img src="../images/google.svg" alt="구글 로그인"
            /></a>
            <a href="https://www.kakao.com" target="_blank"
              ><img src="../images/kakao.svg" alt="카카오 로그인"
            /></a>
          </div>
        </div>
        <div id="sign-up">
          <span>판다마켓이 처음이신가요?</span>
          <a href="../sign-up/index.html" style="color: #3692ff">회원가입</a>
        </div>
      </div>
    </main>

    <script src="../js/main.js"></script>
  </body>
</html>
