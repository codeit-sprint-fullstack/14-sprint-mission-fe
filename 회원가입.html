<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="회원가입.css">
    <title>판다마켓-회원가입</title>
</head>
<body>
    <div class="auth-container">
        <div class="메인판다로고">
            <a href="index.html" class="logo"><img src="images/메인판다.png" alt="판다마켓"></a>
        </div>
        <form>
            <div>
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요">
                <div class="error-message">이메일 형식이 올바르지 않습니다.</div>
            </div>
            <div>
                <label for="name">닉네임</label>
                <input type="text" id="name" name="name" placeholder="닉네임을 입력해주세요">
            <div>
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요">
            </div>
            <div>
                <label for="password-confirm">비밀번호 확인</label>
                <input type="password-confirm" id="password-congirm" placeholder="비밀번호를 다시 한 번 입력해주세요">
                <div class="error-message">비밀번호가 일치하지 않습니다.</div>
            </div>
            <button type="submit" class="btn-submit">회원가입</button>
        </form>
        <div class="social-box">
            <span class="social-text">간편 로그인하기</span>
            <div class="social-icons">
                <a href="https://google.com" target="_blank"><i class="fab fa-google"></i></a>
                <a href="https://kakao.com" target="_blank"><i class="fab fa-kakao"></i></a>
            </div>
        </div>
        <div class="link-box">
            이미 회원이신가요? <a href="login.html">로그인</a>
        </div>
    </div>
</body>
</html>
