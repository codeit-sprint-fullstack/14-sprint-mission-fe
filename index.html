    <nav>
      <ul>
        <li>
          <a href="/"

      <section class="featured">
        <div class="featured-content">

              src="assets/img_home_top.svg"
              alt="판다마켓 메인 히어로 이미지" />
          </div>
        </div>
      </section>
      <section class="standard">
        <div class="content">
          <img src="assets/img_popular.svg" alt="인기 상품 섹션 이미지" />
          <div class="text-wrapper">
            <span class="badge">Hot item</span>

              인기 상품을 <br />

        </div>

      <section class="standard">
        <div class="content">
          <div class="text-wrapper">
            <span class="badge">Search</span>
            <h2>
              구매를 원하는 <br />

            </h2>
            <p>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</p>

          <img src="assets/img_search.svg" alt="상품 검색 섹션 이미지" />

      </section>
      <section class="standard">
        <div class="content">
          <img src="assets/img_register.svg" alt="상품 등록 섹션 이미지" />
          <div class="text-wrapper">
            <span class="badge">Register</span>
            <h2>
              판매를 원하는 <br />
              상품을 등록하세요
            </h2>
            <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
          </div>
        </div>

      <section class="featured">
        <div class="featured-content">
          <h2>믿을 수 있는 <br />판다마켓 중고거래</h2>
          <img
            src="assets/img_home_bottom.svg"
            alt="믿을 수 있는 판다마켓 이미지" />
