<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/home.css" />

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-LX93GZ5H86"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-LX93GZ5H86");
    </script>
  </head>

  <body>
    <header>
      <a href="/">
        <img src="images/logo/logo.svg" alt="판다마켓 홈" width="153"/>
      </a>
      <nav aria-label="주요 메뉴">
        <ul>
          <li><a href="page/login.html" id="loginLinkButton" class="button">로그인</a></li>
        </ul>
      </nav>
    </header>

    <main class="with-header">
      <section id="hero" class="banner">
        <div class="wrapper">
          <h1>
            일상의 모든 물건을<br />
            거래해 보세요
          </h1>
          <a href="page/items.html" class="button pill-button">구경하러 가기</a>
        </div>
      </section>

      <section id="features" class="wrapper">
        <div class="feature">
          <img
            src="images/home/feature1-image.png"
            alt="인기 상품"
            width="50%"
          />
          <div class="feature-content">
            <p class="feature-tag">Hot item</p>
            <h2>인기 상품을<br />확인해 보세요</h2>
            <p class="feature-description">
              가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요
            </p>
          </div>
        </div>
        <div class="feature">
          <div class="feature-content">
            <p class="feature-tag">Search</p>
            <h2>구매를 원하는<br />상품을 검색하세요</h2>
            <p class="feature-description">
              구매하고 싶은 물품은 검색해서
              <br />쉽게 찾아보세요
            </p>
          </div>
          <img
            src="images/home/feature2-image.png"
            alt="검색 기능"
            width="50%"
          />
        </div>
        <div class="feature">
          <img
            src="images/home/feature3-image.png"
            alt="판매 상품 등록"
            width="50%"
          />
          <div class="feature-content">
            <p class="feature-tag">Register</p>
            <h2>판매를 원하는<br />상품을 등록하세요</h2>
            <p class="feature-description">
              어떤 물건이든 판매하고 싶은 상품을
              <br />쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section id="bottomBanner" class="banner">
        <div class="wrapper">
          <h2>
            믿을 수 있는
            <br />
            판다마켓 중고거래
          </h2>
        </div>
      </section>
    </main>

    <footer>
      <div>©codeit - 2024</div>
      <div id="footerMenu">
        <ul>
          <li><a href="page/privacy.html">Privacy Policy</a></li>
          <li><a href="page/faq.html">FAQ</a></li>
        </ul>
      </div>
      <div id="socialMedia">
        <a
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img src="images/social/facebook-logo.svg" alt="페이스북" width="20"
        /></a>
        <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer"
          ><img src="images/social/twitter-logo.svg" alt="트위터" width="20"
        /></a>
        <a
          href="https://www.youtube.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img src="images/social/youtube-logo.svg" alt="유튜브" width="20"
        /></a>
        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img
            src="images/social/instagram-logo.svg"
            alt="인스타그램"
            width="20"
        /></a>
      </div>
    </footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
