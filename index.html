        </section>
        <section class="main_03">
            <img class="" src="images/Img_home_03.png" alt="image_home_03">

            <h3 class="detail">
                    판매를 원하는<br>
                    상품을 등록하세요
            </h3>
            <h4>
                    어떤 물건이든 판매하고 싶은 상품을<br>
                    쉽게 등록하세요
            </h4>
            </div>

            <h1 style="margin-bottom: 200px;">
                믿을 수 있는<br>
