<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/판다 얼굴.png">

  <meta name="description" content="일상에서 모든 물건을 거래해보세요">

  <meta property="og:type" content="website">
  <meta property="og:title" content="판다마켓">
  <meta property="og:description" content="일상에서 모든 물건을 거래해보세요">
  <meta property="og:url" content="https://sprint-mission-chom.netlify.app"> 
  <meta property="og:image" content="https://sprint-mission-chom.netlify.app/images/og_image.png">
  <meta property="og:image:width" content="1200">  // 카카오톡/페이스북 권장 규격(1200x630)으로 설정함
  <meta property="og:image:height" content="630">
</head>
<body>
  <header>
    <a href="index.html">
      <img class="pandamarket-logo" src="images/pandamarket_logo.png" alt="판다마켓 로고">
    </a>
    <a href="login.html" class="login-button">로그인</a>
  </header>
  <section class="top-banner">
    <div class="top-banner-contents">
      <h1>일상의 모든 물건을<br>거래해보세요</h1>
      <a href="items.html" class="searching-button">구경하러 가기</a>
    </div>
    <img class="banner-image" src="images/Img_home_top.png" alt="image-home-top">
  </section>
  <main>
    <section class="main-01">
      <img class="main-image" src="images/Img_home_01.png" alt="image_home_01">
      <div class="main-contents">
        <div class="description-01">
          <p class="category">Hot Item</p>
          <h3>인기 상품을<br>확인해 보세요</h3>
        </div> 
        <p class="description-02">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
      </div>
    </section>
    <section class="main-02">
      <div class="main-contents">
        <div class="description-01">
          <p class="category">Search</p>
          <h3>구매를 원하는<br>상품을 검색하세요</h3>
        </div>
        <p class="description-02">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
      </div>
      <img class="main-image" src="images/Img_home_02.png" alt="image_home_02">
    </section>
    <section class="main-03">
      <img class="main-image" src="images/Img_home_03.png" alt="image_home_03">
      <div  class="main-contents">
        <div class="description-01">
          <p class="category">Register</p>
          <h3>판매를 원하는<br>상품을 등록하세요</h3>
        </div>
        <p class="description-02">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
      </div>
    </section>
  </main>
  <section class="bottom-banner">
    <div class="bottom-banner-contents">
      <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
    </div>
    <img class="image-home-bottom" src="images/Img_home_bottom.png" alt="image_home_bottom">
  </section>
  <footer>
    <p class="copyright">@codeit - 2024</p>
    <div class="sitemap">
      <a href="Privacy Policy.html">Privacy Policy</a>
      <a href="FAQ.html">FAQ</a>
    </div>
    <div class="social-media-link ">
      <a href="https://www.facebook.com" target="_blank">
      <img src="images/ic_facebook.png" alt="facebook">
      </a>
      <a href="https://www.x.com" target="_blank">
      <img src="images/ic_twitter.png" alt="twitter">
      </a>
      <a href="https://www.youtube.com" target="_blank">
      <img src="images/ic_youtube.png" alt="youtube">
      </a>
      <a href="https://www.instagram.com" target="_blank">
      <img src="images/ic_instagram.png" alt="instagram">
      </a>
    </div>
  </footer>
</body>   
</html>
