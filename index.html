<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>판다마켓</title>
	<link rel="stylesheet" href="css/font.css">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/stye.css">
</head>
<body>
    <header id="header">
		<div class="inner">
			<a href="#" class="logo">
				<img src="img/Group 22.png" alt="판다마켓 로고">
				판다마켓
			</a>
			<a href="/login" class="login btn">로그인</a>
		</div>
	</header>
	<main id="main">
		<section id="visual">
			<div class="inner">
				<div class="text_wrap">
					일상의 모든 물건을<br>
					거래해 보세요
					<a href="/items" class="btn go_buy_page">
						구경하러 가기
					</a>
				</div>
				<div class="img_wrap">
					<img src="img/Img_home_top.png" alt="메인페이지 상단 이미지">
				</div>
			</div>
		</section>
		<section id="con">
			<div class="inner">
				<div class="box">
					<div class="img_wrap">
						<img src="img/Img_home_01.png" alt="">
					</div>
					<div class="text_wrap">
						<span class="dec_title">
							Hot Item
						</span>
						<span class="box_title">
							인기 상품을<br>확인해 보세요
						</span>
						<span class="box_text">
							가장 HOT한 중고거래 물품을<br>
							판다 마켓에서 확인해 보세요
						</span>
					</div>
				</div>
				<div class="box">
					<div class="text_wrap left">
						<span class="dec_title">
							Search
						</span>
						<span class="box_title">
							구매를 원하는<br>
							상품을 검색하세요
						</span>
						<span class="box_text">
							구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요
						</span>
					</div>
					<div class="img_wrap">
						<img src="img/Img_home_02.png" alt="">
					</div>
				</div>
				<div class="box">
					<div class="img_wrap">
						<img src="img/Group 33682.png" alt="">
					</div>
					<div class="text_wrap">
						<span class="dec_title">
							Register
						</span>
						<span class="box_title">
							판매를 원하는 <br>
							상품을 등록하세요
						</span>
						<span class="box_text">
							어떤 물건이든 판매하고 싶은 상품을<br>
							쉽게 등록하세요
						</span>
					</div>
				</div>
			</div>
		</section>
		<section id="bottom_banner">
			<div class="inner">
				<div class="text_wrap">
					믿을 수 있는<br>
					판다마켓 중고 거래<br>
				</div>
				<div class="img_wrap">
					<img src="img/Img_home_bottom.png" alt="">
				</div>
			</div>		
		</section>
	</main>
	<footer id="footer">
		<div class="inner">
			<div class="copyright">©codeit - 2024</div>
			<ul id="footer_menu">
				<li>
					<a href="/privacy">Privacy Policy</a></li>
				<li>
					<a href="/faq">FAQ</a>
				</li>
			</ul>
			<div class="comm_wrap">
				<a href="https://www.facebook.com/codeit.kr/" target="_blank" class="comm_btn">
					<img src="img/Group.png" alt="">
				</a>
				<a href="https://x.com/?lang=ko" target="_blank" class="comm_btn">
					<img src="img/Vector.png" alt="">
				</a>
				<a href="https://www.youtube.com/channel/UCCM79CPm2WbBYTRaiNEExbg" target="_blank" class="comm_btn">
					<img src="img/Group (1).png" alt="">
				</a>
				<a href="https://www.instagram.com/codeit_kr/" target="_blank" class="comm_btn">
					<img src="img/ic_instagram.png" alt="">
				</a>
			</div>
		</div>
	</footer>
</body>
</html>
