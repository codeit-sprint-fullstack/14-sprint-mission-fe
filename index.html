<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@4.0.1/reset.min.css" />
    <link rel="stylesheet" href="/css/main.css" />
</head>

<body>

    <header>
        <div class="header-contents">
            <h1 class="header-logo">
                <a href="/">
                    <img src="/img/icon/main_logo.svg" alt="" />
                    <img src="/img/icon/main_logo_text.svg" alt="판다마켓" />
                </a>
            </h1>
            <a href="/login.html">
                <div class="login-btn">로그인</div>
            </a>
        </div>
    </header>

    <div class="hero-section"> <!-- 하늘색 배경 줄거고 -->
        <div class="hero-content"> <!-- 내부 콘텐츠 -->
            <div class="hero-text">
                <h2>일상의 모든 물건을<br> 거래해 보세요</h2>
                <a href="/items.html">
                    <div class="item-btn">구경하러 가기</div>
                </a>
            </div>
            <img class="hero-img" src="/img/Img_home_top.png" alt="메인 섹션 이미지" />
        </div>
    </div>

    <div class="card-container">
        <img src="/img/Img_home_01.png" alt="">
        <div class="card-text">
            <span>Hot item</span>
            <h2>인기 상품을<br>확인해 보세요</h2>
            <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해보세요</p>
        </div>
    </div>

    <div class="card-container reverse">
        <div class="card-text">
            <span>Search</span>
            <h2>인기 상품을<br>확인해 보세요</h2>
            <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
        </div>
        <img src="/img/Img_home_02.png" alt="">
    </div>

    <div class="card-container">
        <img src="/img/Img_home_03.png" alt="">
        <div class="card-text">
            <span>Register</span>
            <h2>판매를 원하는<br>상품을 등록하세요</h2>
            <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
        </div>
    </div>

    <div class="hero-section">
        <div class="hero-content align-center">
            <div class="hero-text">
                <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
            </div>
            <img class="hero-img" src="/img/Img_home_bottom.png" alt="메인 섹션 이미지" />
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <span>@codeit - 2024</span>
            <div class="footer-tag">
                <a href="/privacy.html"><span>Privacy Policy</span></a>
                <a href="/faq.html"><span>FAQ</span></a>
            </div>
            <div class="footer-icon">
                <a href="https://www.youtube.com/" target="_blank"><img src="/img/icon/ic_facebook.png" alt="페이스북"></a>
                <a href="https://www.youtube.com/" target="_blank"><img src="/img/icon/ic_twitter.png" alt="트위터"></a>
                <a href="https://www.youtube.com/" target="_blank"><img src="/img/icon/ic_youtube.png" alt="유튜브"></a>
                <a href="https://www.youtube.com/" target="_blank"><img src="/img/icon/ic_instagram.png"
                        alt="인스타그램"></a>
            </div>
        </div>
    </footer>
</body>

</html>
