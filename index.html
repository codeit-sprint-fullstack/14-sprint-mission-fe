<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
    <div class="logo">
      <a href="/">
        <img src="/img/panda-face.png" alt="판다마켓 로고">
        <div class="title">판다마켓</div>
      </a>
    </div>
    <div class="login">
      <a href="/login.html" class="btn bg">로그인</a>
    </div>
  </header>
  <div class="container">
    <div class="banner main-banner">
      <div class="banner-inner">
        <div class="text-wrap">
          <div class="txt">일상의 모든 물건을<br>거래해 보세요</div>
          <a href="/item.html" class="btn btn-view bg">구경하러 가기</a>
        </div>
        <img src="/img/Img_home_top.png" alt="메인베너 이미지">
      </div>
        </div>
    <div class="section">
      <div class="inner">
        <div class="contents">
          <img src="/img/Img_home_01.png" alt="hot item 영역 이미지">
          <div class="text-wrap right">
            <div class="category-txt">Hot item</div>
            <div class="title">인기 상품을<br> 확인해 보세요</div>
            <div class="sub-txt">
              가장 HOT한 중고거래 물품을<br>판다마켓에서 확인해 보세요
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="inner">
        <div class="contents">
          <div class="text-wrap left">
            <div class="category-txt">Search</div>
            <div class="title">구매를 원하는<br>상품을 검색하세요</div>
            <div class="sub-txt">
              구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요
            </div>
          </div>
          <img src="/img/Img_home_02.png" alt="Search 영역 이미지">
        </div>
      </div>
    </div>
    <div class="section">
      <div class="inner">
        <div class="contents">
          <img src="/img/Img_home_03.png" alt="register 영역 이미지">
          <div class="text-wrap right">
            <div class="category-txt">Register item</div>
            <div class="title">판매를 원하는<br>상품을 등록하세요</div>
            <div class="sub-txt">
              어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="banner bottom-banner">
      <div class="banner-inner">
        <div class="text-wrap">
          <div class="txt">믿을 수 있는<br>판다마켓 중고 거래</div>
        </div>
        <img src="/img/Img_home_bottom.png" alt="하단 이미지">
      </div>
    </div>
  </div>
  <footer>
    <div class="footer-inner">
      <div class="copyright">
        ©codeit - 2024
      </div>
      <div class="privacy-faq clear">
        <a href="/" class="privacy-link">Privacy Police</a >
        <a href="/">FAQ </a>
      </div>
      <div class="sns-wrap clear">
        <a href="https://www.facebook.com/" target="_blank"><img src="/img/ic_facebook.svg" alt="페이스북"></a>
        <a href="https://x.com/" target="_blank"><img src="/img/ic_twitter.svg" alt="트위터"></a>
        <a href="https://www.youtube.com/" target="_blank"><img src="/img/ic_youtube.svg" alt="유튜브"></a>
        <a href="https://www.instagram.com/" target="_blank"><img src="/img/ic_instagram.svg" alt="인스타그램"></a>
      </div>
    </div>
  </footer>
</body>
</html>
