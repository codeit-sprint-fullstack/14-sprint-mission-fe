<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓 로그인</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-48VS25KCEG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-48VS25KCEG');
  </script>

  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-dynamic-subset.css">
  <link rel="stylesheet" href="login_style.css">

</head>

<body>
  <main class="login_main">
    <div class="login_area">
      <a href="index.html" class="logo">
        <img src="images/판다 얼굴.png" alt="로고">
        <span class="panda-letters">판다마켓</span>
      </a>
      <form>
        <label for="email" class="input-title">이메일</label>
        <input class="input-field" id="email" type="email"
          placeholder="이메일을 입력해주세요"
          required>
          
        <label for="password" class="input-title">비밀번호</label>
          <div class="password-visible">
            <input class="input-field" id="password" type="password" 
              placeholder="비밀번호를 입력해주세요"
              required>
            <button type="button" class="eye-button">
              <img src="images/btn_visibility_on_24px.png" alt="비밀번호 보기">
            </button>
          </div>
        <button type="submit" class="loginButton">로그인</button>
      </form>
      
      <div class="simple_login">
        <div class="leftSimpleLogin">
          <div>간편 로그인하기</div>
        </div>        
        <div class="rightSimpleLogin">
          <a href="https://www.google.com/">
            <img src="images/Component2@3x.png" alt="구글">
          </a>
          <a href="https://kakaocorp.com/page/">
            <img src="images/Component3@3x.png" alt="카카오">
          </a>
        </div>
      </div>

      <div class="signup">판다마켓이 처음이신가요?
        <a href="signup.html">회원가입</a>
      </div>  
    </div>  
  </main>
</body>
</html>
