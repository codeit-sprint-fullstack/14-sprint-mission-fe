<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 판다마켓</title>
    <style>
        body {
            background-color: #f9fafb;
            margin: 0;
            font-family: sans-serif;
        }

        .container {
            width: 640px;
            margin: 0 auto;
            padding-top: 60px;
        }

        .logo {
            display: block;
            text-align: center;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .logo img {
            height: 110px;
            vertical-align: middle;
        }

        .logo span {
            font-size: 80px;
            font-weight: bold;
            color: #3692FF;
            margin-left: 12px;
            vertical-align: middle;
        }

        .label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .input {
            width: 100%;
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background-color: #f3f4f6;
            box-sizing: border-box;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            margin-top: 24px;
            background-color: #3692FF;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .sns-box {
            margin-top: 16px;
            padding: 16px 24px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background-color: white;
            overflow: hidden;
        }

        .sns-box span {
            float: left;
            line-height: 44px;
        }

        .sns-box .icons {
            float: right;
        }

        .sns-icon {
            display: inline-block;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            text-align: center;
            line-height: 44px;
            font-weight: bold;
            text-decoration: none;
            margin-left: 8px;
        }

        .google {
            background-color: white;
            border: 1px solid #e5e7eb;
            color: #4285F4;
            font-size: 20px;
        }

        .kakao {
            background-color: #FEE500;
            color: #3C1E1E;
            font-size: 18px;
        }

        .signup-text {
            text-align: center;
            margin-top: 24px;
            color: #6b7280;
        }

        .signup-text a {
            color: #3692FF;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">

        <a class="logo" href="index.html">
            <img src="img/panda_logo.png" alt="판다마켓 로고">
            <span>판다마켓</span>
        </a>

        <label class="label" for="email">이메일</label>
        <input class="input" type="email" id="email" placeholder="이메일을 입력해주세요">

        <label class="label" for="password">비밀번호</label>
        <input class="input" type="password" id="password" placeholder="비밀번호를 입력해주세요">

        <button class="login-btn">로그인</button>

        <div class="sns-box">
            <span>간편 로그인하기</span>
            <div class="icons">
                <a class="sns-icon google" href="https://www.google.com/" target="_blank">G</a>
                <a class="sns-icon kakao" href="https://www.kakaocorp.com/page/" target="_blank">K</a>
            </div>
        </div>

        <p class="signup-text">
            판다마켓이 처음이신가요? <a href="signup.html">회원가입</a>
        </p>

    </div>

</body>
</html>
