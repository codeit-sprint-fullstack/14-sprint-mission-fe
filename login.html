<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 판다마켓</title>
    <style>
        @font-face {
            font-family: 'ROKAF Sans';
            src: url('ROKAF%20Sans%20Bold.ttf') format('truetype');
        }

        /* 컬러 팔레트 */
        :root {
            --primary-blue: #3692FF;
            --page-bg: #f9fafb;
            --input-bg: #f3f4f6;
            --border-gray: #e5e7eb;
            --text-mute: #6b7280;
            --google-blue: #4285F4;
            --kakao-yellow: #FEE500;
            --kakao-text: #3C1E1E;
        }

        body {
            background-color: var(--page-bg);
            margin: 0;
        }

        .container {
            width: 640px;
            margin: 0 auto;
            padding-top: 60px;
        }

        .logo {
            display: block;
            text-align: center;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .logo img {
            height: 120px;
            vertical-align: middle;
        }

        .logo span {
            font-size: 40px;
            font-weight: bold;
            color: var(--primary-blue);
            margin-left: 12px;
            vertical-align: middle;
            font-family: 'ROKAF Sans', sans-serif;
        }

        .label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .input {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background-color: var(--input-bg);
            box-sizing: border-box;
            font-size: 14px;
        }

        .input:focus {
            border: 1px solid var(--primary-blue);
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            margin-top: 24px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .sns-box {
            margin-top: 16px;
            padding: 16px 24px;
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            background-color: white;
            overflow: hidden;
        }

        .sns-box span {
            float: left;
            line-height: 44px;
        }

        .sns-box .icons {
            float: right;
        }

        .sns-icon {
            display: inline-block;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            text-align: center;
            line-height: 44px;
            font-weight: bold;
            text-decoration: none;
            margin-left: 8px;
        }

        .google {
            background-color: white;
            border: 1px solid var(--border-gray);
            color: var(--google-blue);
            font-size: 20px;
        }

        .kakao {
            background-color: var(--kakao-yellow);
            color: var(--kakao-text);
            font-size: 18px;
        }

        .signup-text {
            text-align: center;
            margin-top: 24px;
            color: var(--text-mute);
        }

        .signup-text a {
            color: var(--primary-blue);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">

        <a class="logo" href="index.html">
            <img src="img/panda_logo.png" alt="판다마켓 로고">
            <span>판다마켓</span>
        </a>

        <label class="label" for="email">이메일</label>
        <input class="input" type="email" id="email" placeholder="이메일을 입력해주세요">

        <label class="label" for="password">비밀번호</label>
        <input class="input" type="password" id="password" placeholder="비밀번호를 입력해주세요">

        <button class="login-btn">로그인</button>

        <div class="sns-box">
            <span>간편 로그인하기</span>
            <div class="icons">
                <a class="sns-icon google" href="https://www.google.com/" target="_blank"><img src="img/google_logo.png" alt="구글" style="width: 44px; height: 44px; border-radius: 50%;"></a>
                <a class="sns-icon kakao" href="https://www.kakaocorp.com/page/" target="_blank"><img src="img/kakaotalk_logo.png" alt="카카오" style="width: 44px; height: 44px; border-radius: 50%;"></a>
            </div>
        </div>

        <p class="signup-text">
            판다마켓이 처음이신가요? <a href="signup.html">회원가입</a>
        </p>

    </div>

</body>
</html>
