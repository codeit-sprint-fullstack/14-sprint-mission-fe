<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="stylesheet" href="/styles/login.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KQ00BPV0H2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-KQ00BPV0H2');
  </script>
</head>
<body>
  <div class="page-wrapper">
    <header>
      <div class="header-container">
        <a href="index.html">
          <img src="images/Img_panda.png" alt="판다마켓 로고">
          <h1 class="header-title">판다마켓</h1>
        </a>
      </div> 
    </header>
    <main>
      <div class="main-container">
        <form>
          <div>
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" placeholder="이메일을 입력해주세요">
          </div>
          <div>
            <label for="password">비밀번호</label>
            <div class="input-password">
              <input id="password" name="password" type="password" autocomplete="off" placeholder="비밀번호를 입력해주세요">
              <img src="images/ic_eye_closed.png" alt="비밀번호 보기">
            </div>
          </div>
          <button type="submit">로그인</button>
        </form>
        <div class="social-login">
          <p>간편 로그인하기</p>
          <div class="social-link">
            <a href="https://www.google.com/" target="_blank"><img src="images/ic_google.png" alt="구글"></a>
            <a href="https://www.kakaocorp.com/page/" target="_blank"><img src="images/ic_kakaotalk.png" alt="카카오톡"></a>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="footer-container">
        <p>판다마켓이 처음이신가요? <a href="signup.html">회원가입</a></p>
      </div>
    </footer>
  </div>
