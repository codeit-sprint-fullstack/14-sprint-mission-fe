<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="css/signup.css">
  <link rel="icon" href="images/판다 얼굴.png">
</head>
<body>
  <div class="container">
    <header>
        <a class="pandeface" href="index.html">
            <img src="images/판다 얼굴.png" alt="판다마켓 로고">
        </a>
        <a class="pandeface-logo" href="index.html">판다마켓</a>
    </header>
    <main>
      <form>
        <div class="label-input">
          <label for="signup-email">이메일</label>
          <input id="signup-email" name="email" type="email" placeholder="이메일을 입력해주세요">
          <div id="signup-email-error" class="input-error"></div>
        </div>
        <div class="label-input">
          <label for="signup-nickname">닉네임</label>
          <input id="signup-nickname" name="nickname" type="text" placeholder="닉네임을 입력해주세요">
        </div>
        <div class="label-input">
          <label for="signup-password">비밀번호</label>
          <div class="password-wrapper">
            <input id="signup-password" name="password" type="password" placeholder="비밀번호를 입력해주세요">
            <button type="button" id="signup-password-toggle" class="password-toggle-btn">
              <img src="images/btn_visibility_off_24px.svg" alt="비밀번호 표시">
            </button>
          </div>
          <div id="signup-password-error" class="input-error"></div>
        </div>
        <div class="label-input">
          <label for="signup-password-confirm">비밀번호 확인</label>
          <div class="password-wrapper">
            <input id="signup-password-confirm" name="password_confirm" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
            <button type="button" id="signup-password-confirm-toggle" class="password-toggle-btn">
              <img src="images/btn_visibility_off_24px.svg" alt="비밀번호 표시">
            </button>
          </div>
          <div id="signup-password-confirm-error" class="input-error"></div>
        </div>
        <button id="signup-btn" disabled>회원가입</button>
      </form>
      <div class="easy-login">
        <p>간편 로그인하기</p>
        <div class="social-login">
          <a href="https://www.google.com/" target="_blank">
            <img src="images/google.png" alt="login-with-google">
          </a>
          <a href="https://www.kakaocorp.com/page/" target="_blank">
            <img src="images/kakaotalk.png" alt="login-with-kakaotalk">
          </a>
        </div>
      </div>
      <div class="login">
        <p class="check-membership">이미 회원이신가요?</p>
        <a class="login-link" href="login.html">로그인</a>
      </div>
    </main>
  </div>
  <script type="module" src="js/signup.js"></script>
</body>
</html>
