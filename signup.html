<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css" class="css">
    <link rel="stylesheet" href="auth.css" class="css">
    <title>signup</title>
</head>
<div class="content-container">
<body class="signup_body">
    <header>
        <a href="index.html">
        <img id="pandaface" src="photo/판다 얼굴.svg" >
        </a>
        <p>판다마켓</p>
    </header>

    <div class="input_zone">
    <label for="e-mail">이메일</label>
    <input id="e-mail" type="email" placeholder="이메일을 입력해주세요">
    </div>
       <div class="input_zone">
    <label for="nickname">닉네임</label>
    <input id="nickname" type="text" placeholder="닉네임을 입력해주세요">
    </div>
    <div class="input_zone">
    <label for="password">비밀번호</label>
    <input id="password" type="password" placeholder="비밀번호를 입력해주세요">
    <button class="eye_button"  type="button">
        <img src="photo/눈 버튼.svg">
    </button>
    </div>
    <div class="input_zone">
    <label for="password_check">비밀번호 확인</label>
    <input id="password_check" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
    <button class="eye_button"  type="button">
        <img src="photo/눈 버튼.svg">
    </button>
    </div>

    <button>회원가입</button>

    <div class="simple_login_tab">
        <p id="simple_login">간편 로그인하기</p>
        <p class="login-link"> 
            <a href="https://www.google.com/">
            <img id= "google-icon" src="photo/ic-google.png">
            </a>
            <a href="https://www.kakaocorp.com/page/">
            <img id= "kakao-icon" src="photo/ic-kakao.svg">
            </a>
        </p>
    </div>
    <div class="login_bottom">
     이미 회원이신가요?
     <a href="login.html" >로그인</a>
    </div>
</body>
</div>
</html>
