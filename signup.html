<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <main id="auth">
        <div class="auth-wrap">
            <h2>
                <a href="/">
                    <img src="/images/panda_face.png" alt="panda face">
                    <span>판다마켓</span>
                </a>
            </h2>
            <form>
                <div class="input">
                    <label for="email">이메일</label>
                    <div class="input-area">
                        <input type="text" id="email" placeholder="이메일을 입력해주세요">
                    </div>
                </div>
                <div class="input">
                    <label for="email">닉네임</label>
                    <div class="input-area">
                        <input type="text" id="email" placeholder="닉네임을 입력해주세요">
                    </div>
                </div>
                <div class="input">
                    <label for="password">비밀번호</label>
                    <div class="input-area">
                        <input type="password" id="password" placeholder="비밀번호를 입력해주세요">
                        <button type="button">
                            <img src="/images/btn_visibility_on_24px.png" alt="password visibility">
                        </button>
                    </div>
                </div>
                <div class="input">
                    <label for="password">비밀번호 확인</label>
                    <div class="input-area">
                        <input type="password" id="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
                        <button type="button">
                            <img src="/images/btn_visibility_on_24px.png" alt="password visibility">
                        </button>
                    </div>
                </div>
                <button type="button" class="auth-btn">회원가입</button>
            </form>
            <div class="easy-login">
                <p>간편 로그인하기</p>
                <ul>
                    <li>
                        <a href="https://www.google.com/">
                            <img src="/images/Component 2.png" alt="google logo">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.kakaocorp.com/page/">
                            <img src="/images/Component 3.png" alt="kakaotalk logo">
                        </a>
                    </li>
                </ul>
            </div>
            <div class="auth-link">
                <p>이미 회원이신가요?</p>
                <a href="/login">로그인</a>
            </div>
        </div>
    </main>
</body>
</html>
