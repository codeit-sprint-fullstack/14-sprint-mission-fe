<!-- 
    <VS Code에서 HTML 기본구조 자동생성하기>

    - `!` 입력 후 tab 키를 누르면 HTML 기본 양식이 입력됩니다.

    - 이때, <html lang="en"> 부분을 매번 lang="ko"로 바꾸는 것이 번거로우니 양식을 바꿔봅시다.
      command/ctrl + 쉼표 를 눌러 VS Code 설정창을 열고 emmet을 검색해 주세요. 
      스크롤을 내려 Emmet: Variables 섹션에 Add Item을 누르고 lang Item의 Value를 ko로 바꿔 입력해 주세요. 
      마지막으로 Add Item 버튼을 눌러 저장하면 끝!
-->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 기본 양식 생성 후, 제목을 수정하고 해당 페이지에 적용할 파비콘 및 스타일시트를 추가해 주세요. -->
    <title>판다마켓 - 회원가입</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/signup.css">
  </head>

  <body>
    <!-- 화면 정가운데 정렬을 위한 컨테이너 -->
      <div class="signup-container">
        <!-- 로그인 박스 -->
        <div class="signup-box">
          <div class="logo-box">
            <a href="/">
              <img
                src="images/mission2/text_logo.png"
                alt="판다마켓 로고"
                class="signup-logo"
              />
            </a>
          </div>

          <form class="signup-input-container" action="#" method="POST">
            <!-- 이메일 박스 -->
            <div class="signup-input-group">
              <label for="email" class="signup-input-label">이메일</label>
              <input
                type="email"
                id="email"
                class="signup-input-field"
                placeholder="이메일을 입력해주세요"
                required
              />
            </div>

            <!-- 닉네임 박스 -->
            <div class="signup-input-group">
              <label for="nickname" class="signup-input-label">닉네임</label>
              <input
                type="text"
                id="nickname"
                class="signup-input-field"
                placeholder="닉네임을 입력해주세요"
                required
              />
            </div>

            <!-- 비밀번호 박스 -->
            <div class="signup-input-group">
              <label for="password" class="signup-input-label">비밀번호</label>
              <div class="signup-password-wrapper">
                <input
                  type="password"
                  id="password"
                  class="signup-input-field"
                  placeholder="비밀번호를 입력해주세요"
                  required
                />
                <img
                  src="images/mission2/btn_visibility_on_24px.png"
                  alt="비밀번호 보이기"
                  class="password-img"
                />
              </div>
            </div>

            <!-- 비밀번호 확인 박스 -->
            <div class="signup-input-group">
              <label for="password-confirm" class="signup-input-label"
                >비밀번호 확인</label
              >
              <div class="signup-password-wrapper">
                <input
                  type="password"
                  id="password-confirm"
                  class="signup-input-field"
                  placeholder="비밀번호를 다시 한 번 입력해주세요"
                  required
                />
                <img
                  src="images/mission2/btn_visibility_on_24px.png"
                  alt="비밀번호 보이기"
                  class="password-img"
                />
              </div>
            </div>

            <!-- 회원가입 버튼 -->
            <div class="signup-button-box">
              <button type="submit" class="signup-btn">회원가입</button>
            </div>

            <!-- 간편 로그인 -->
            <div class="signup-social-login-box">
              <span class="signup-social-login-title">간편 로그인하기</span>

              <div class="signup-social-button-group">
                <a
                  href="https://www.google.com/"
                  target="_blank"
                  class="btn-social google"
                >
                  <img
                    src="images/mission2/Component 2.png"
                    alt="구글로 로그인하기"
                  />
                </a>

                <a
                  href="https://www.kakaocorp.com/page/"
                  target="_blank"
                  class="btn-social kakao"
                >
                  <img
                    src="images/mission2/Component 3.png"
                    alt="카카오톡으로 로그인하기"
                  />
                </a>
              </div>
            </div>
          </form>

          <div class="signup-register-link-box">
            <span>이미 회원이신가요?</span>
            <a href="login.html" class="signup-register-link">로그인</a>
          </div>
        </div>
      </div>
  </body>
</html>
