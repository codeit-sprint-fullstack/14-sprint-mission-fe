<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓 - 회원가입</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <section class="signup_section">
    <div class="signup_container">

      <!-- 로고 -->
      <div class="signup_logo_wrapper">
        <a href="/" >
          <image src="/assets/image/icons/main_icon.svg" class="signup_logo" width="104" height="104" alt="logo image">
        </a>
        <span class="signup_logo_text">판다마켓</span>
      </div>

      <!-- 회원가입 폼 -->
      <form class="signup_form" id="signupForm" novalidate>
        <div class="signup_field_group">
          <label class="signup_label">이메일</label>
          <input
            class="signup_input"
            type="email"\
            placeholder="이메일을 입력해주세요"
          >
        </div>

        <div class="signup_field_group">
          <label class="signup_label">닉네임</label>
          <input
            class="signup_input"
            type="text"
            placeholder="닉네임을 입력해주세요"
          >
        </div>

        <div class="signup_field_group">
          <label class="signup_label">비밀번호</label>
          <div class="signup_password_wrapper">
          <input
            class="signup_input"
            type="password"
            placeholder="비밀번호를 입력해주세요"
          >

      </div>
    </div>

          <div class="signup_password_wrapper">
            <input
              class="signup_input"
              type="password"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            >

        <button type="submit" class="signup_button">회원가입</button>
      </form>

      <!-- 간편 로그인 -->
      <div class="signup_sns_wrapper">
        <span class="signup_sns_label">간편 로그인하기</span>
        <div class="signup_sns_icons">
          <a href="https://www.google.com/" class="signup_sns_icon_link">
            <img src="/assets/image/icons/google_solid.png" alt="구글 소셜 로그인 아이콘" class="signup_sns_icon">
          </a>
          <a href="https://www.kakaocorp.com/page/" class="signup_sns_icon_link">
            <img src="/assets/image/icons/kakaotalk_solid.png" alt="카카오 소셜 로그인 아이콘" class="signup_sns_icon">
          </a>
        </div>
      </div>

      <!-- 로그인 링크 -->
      <p class="signup_signup_text">
        이미 회원이신가요?
        <a href="./login.html" class="signup_signup_link">로그인</a>
      </p>

    </div>
  </main>


</body>
</html>
