<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="signup.css">

  <link rel="icon" type="image/png" href="image/판다얼굴.png">

   <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M8C11VMVQ7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-M8C11VMVQ7');
  </script>
</head>

<body style="width: 100%;">
  <div class="signup_page">

    <a href="index.html" style="text-decoration-line: none;">
    <div class="pandaLogo">
      <img src="image/판다얼굴.png" alt="판다 얼굴" class="pandaFace">
      <h1 class="pandaText">판다마켓</h1>
    </div>
    </a>

    <div class="email_group">
      <label for="email">이메일</label>
      <input id="email_input" name="email" type="email" placeholder="이메일을 입력해주세요">
    </div>

    <div class="Nickname_group">
      <label for="text">닉네임</label>
      <input id="Nickname_input" name="text" type="text" placeholder="닉네임을 입력해주세요">
    </div>

<div class="password_group">
  <label for="password_input">비밀번호</label>

  <div class="password_set">
    <input
      id="password_input"
      name="password"
      type="password"
      placeholder="비밀번호를 입력해주세요"
    >

    <button type="button" id="password_toggle" class="password_toggle">
      <img
        id="password_icon"
        src="image/eye.png"
        alt="비밀번호 보기">
    </button>
  </div>

 <div class="password_check_group">
  <label for="password_check_input">비밀번호 확인</label>

  <div class="password_check_set">
    <input
      id="password_check_input"
      name="password_check"
      type="password"
      placeholder="비밀번호를 다시 한 번 입력해주세요"
    >

    <button type="button" id="password_check_toggle" class="password_check_toggle">
      <img
        id="password_check_icon"
        src="image/eye.png"
        alt="비밀번호 확인 보기">
    </button>
  </div>
</div>
  
  <div>
    <a href="-" class="signup_btn" style="color: #f3f4f6;">회원가입</a>
  </div>

<div class="Easy_login_group">
  <div class="Easy_login1">
    <p class="Easy_login2">간편 로그인하기</p>
  </div>
  <div class="Easy_login_logo_group">
    <a href="https://www.google.com/" style="text-decoration-line: none;">
      <img src="image/google.png" alt="구글 로고" class="google_logo"> </a>

    <a href="https://www.kakaocorp.com/page/" >
    <img src="image/kakao.png" alt="카카오톡 로고" class="kakao_logo">
    </a>
  </div>
  </div>

  <div class="First">
    <p class="text1">이미 회원이신가요?</p>
    <a href="login.html" class="signup">로그인</a>
  </div>
</div>

<script>
  const emailInput = document.querySelector("#email_input");
  const nicknameInput = document.querySelector("#Nickname_input");
  const passwordInput = document.querySelector("#password_input");
  const passwordCheckInput = document.querySelector("#password_check_input");
  const signupButton = document.querySelector(".signup_btn");

  const passwordToggle = document.querySelector("#password_toggle");
  const passwordIcon = document.querySelector("#password_icon");

  const passwordCheckToggle = document.querySelector("#password_check_toggle");
  const passwordCheckIcon = document.querySelector("#password_check_icon");

  passwordToggle.addEventListener("click", function () {
    if (passwordInput.type === "password") {
      passwordInput.type = "text";
      passwordIcon.src = "image/eye_hidden.png";
      passwordIcon.alt = "비밀번호 숨기기";
    } else {
      passwordInput.type = "password";
      passwordIcon.src = "image/eye.png";
      passwordIcon.alt = "비밀번호 보기";
    }
  });

  passwordCheckToggle.addEventListener("click", function () {
    if (passwordCheckInput.type === "password") {
      passwordCheckInput.type = "text";
      passwordCheckIcon.src = "image/eye_hidden.png";
      passwordCheckIcon.alt = "비밀번호 확인 숨기기";
    } else {
      passwordCheckInput.type = "password";
      passwordCheckIcon.src = "image/eye.png";
      passwordCheckIcon.alt = "비밀번호 확인 보기";
    }
  });

  function checkSignupInputs() {
    const emailValue = emailInput.value.trim();
    const nicknameValue = nicknameInput.value.trim();
    const passwordValue = passwordInput.value.trim();
    const passwordCheckValue = passwordCheckInput.value.trim();

    if (
      emailValue !== "" &&
      nicknameValue !== "" &&
      passwordValue !== "" &&
      passwordCheckValue !== ""
    ) {
      signupButton.classList.add("active");
    } else {
      signupButton.classList.remove("active");
    }
  }

  emailInput.addEventListener("input", checkSignupInputs);
  nicknameInput.addEventListener("input", checkSignupInputs);
  passwordInput.addEventListener("input", checkSignupInputs);
  passwordCheckInput.addEventListener("input", checkSignupInputs);
</script>

</body>
</html>
