<!DOCTYPE html>
  <html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 페이지</title>

    <link rel="stylesheet" href="signup.css">
  </head>
  
  <body>
    <div class="signup-box">
      <div class="logo-box">
        <a class="logo-link" href="/">
          <img src="images/판다 얼굴.svg" alt="판다 로고">
          <div class="logo-text">
            판다마켓
          </div>
        </a>
      </div>

      <form class="form-box">
        <div action="" class="email-box">
          <label for="email" class="email-text">
            이메일
          </label>
          <input
          type="email"
          class="email-input"
          placeholder="이메일을 입력해주세요">
          <div class="email-error"></div>
        </div>

        <div action="" class="nickname-box">
          <label for="nickname" class="nickname-text">
            닉네임
          </label>
          <input
          type="text"
          class="nickname-input"
          placeholder="닉네임을 입력해주세요">

          <div class="nickname-error"></div>
        </div>

        <div action="" class="password-box">
          <label for="password" class="password-text">
            비밀번호
          </label>
          
          <div class="password-container">
            <input
            type="password"
            class="password-input"
            placeholder="비밀번호를 입력해주세요">

            <img
              src="images/btn_eye_off.png"
              class="toggle-password"
              alt="비밀번호 보기">
          </div>

          <div class="password-error"></div>
        </div>

        <div action="" class="again-box">
          <label for="password" class="again-text">
            비밀번호 확인
          </label>

          <div class="again-container">
            <input
            type="password"
            class="again-input"
            placeholder="비밀번호를 다시 한 번 입력해주세요">

            <img
              src="images/btn_eye_off.png"
              class="toggle-again"
              alt="비밀번호 보기">
          </div>

          <div class="again-error"></div>
        </div>

        <button
          type="submit"
          class="signup-button"
          disabled>
            <div class="signup-text">
              회원가입
            </div>
        </button>
      </form>

      <div class="easy-box">
        <div class="easy-content">
          <div class="easy-text">
            간편 로그인하기
          </div>

          <div class="easy-link">
            <a href="https://www.google.com/">
              <div class="google">
                <img
                src="images/icon/google-logo.png"
                alt="구글 로고"
                class="google-logo">
              </div>
            </a>

            <a href="https://www.kakaocorp.com/page/">
              <div class="kakao">
                <img
                src="images/icon/kakao-logo.svg"
                alt="카카오 로고"
                class="kakao-logo">
              </div>
            </a>
          </div>
        </div>
      </div>

      <div class="already-box">
        <div class="already-text">
          이미 회원이신가요?
        </div>
        
        <a href="login.html">
          <div class="already-link">
            로그인
          </div>
        </a>
      </div>
    </div>

    <div class="modal hidden">
      <div class="modal-box">
        <p class="modal-text"></p>
          <button class="modal-close">확인</button>
      </div>
    </div>

    <script type="module" src="signup.js"></script>
  </body>
</html>
