<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sign-login-wrap signup">
    <div class="logo">
      <a href="/">
        <div class="logo-cont">
          <img src="/img/panda-face-big.png" alt="판다마켓 로고">
          <div class="title">판다마켓</div>
        </div>
      </a>
    </div>
    <div class="form-wrap">
      <div class="form">
        <label for="user-email">이메일</label>
        <input type="text" id="user-email" name="user-email" placeholder="이메일을 입력해주세요">
      </div>
      <div class="form">
        <label for="user-nickname">닉네임</label>
        <input type="text" id="user-nickname" name="user-nickname" placeholder="닉네임을 입력해주세요">
      </div>
      <div class="form">
        <label for="user-password">비밀번호</label>
      <div class="form-password">
        <input type="password" id="user-password" name="user-password" class="input-password" placeholder="비밀번호를 입력해주세요">
        <button class="btn btn-visibilly">
          <img src="/img/btn-visibility.png" alt="비밀번호 보기">
        </button>
      </div>
      </div>
      <div class="form">
        <label for="user-password-check">비밀번호 확인</label>
      <div class="form-password">
        <input type="password" id="user-password-check" name="user-password-check" class="input-password" placeholder="비밀번호를 다시 한 번 입력해주세요 ">
        <button class="btn btn-visibilly">
          <img src="/img/btn-visibility.png" alt="비밀번호 보기">
        </button>
      </div>
      </div>
    </div>
		<button class="btn btn-login">회원가입</button>
		<div class="sign-up-wrap">
			<div class="easy-signup">
				<p>간편 로그인하기</p>
				<div class="icon-wrap">
					<a href="https://www.google.com/" target="_blank" class="google"><img src="/img/ic_google.png" alt="구글"></a>
					<a href="https://w ww.kakaocorp.com/page/" class="kakao"><img src="/img/icon_kako.png" alt="카카오"></a>
			</div>
			</div>
			<p class="sign-up-info">판다마켓이 처음이신가요? <a href="/signup.html" target="_blank">회원가입</a></p>
		</div>
  </div>
</body>
</html>
