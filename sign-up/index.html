<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="../css/sign-up.css" />
  </head>
  <body class="form-frame">
    <header>
      <div class="logo-frame">
        <a href="../index.html" class="logo">
          <img
            src="../images/판다 얼굴.png"
            alt="판다마켓 로고"
            class="logo-img"
          />
          <span class="logo-text">판다마켓</span>
        </a>
      </div>
    </header>
    <main>
      <div id="form-gap">
        <div class="form-group">
          <label for="email">이메일</label>

          <input type="email" id="email" placeholder="이메일을 입력하세요" />
        </div>

        <div class="form-group">
          <label for="nickname">닉네임 </label>

          <input type="text" id="nickname" placeholder="닉네임을 입력하세요" />
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>

          <input
            type="password"
            id="password"
            placeholder="비밀번호를 입력하세요."
          />
        </div>

        <div class="form-group">
          <label for="confirm-password">비밀번호 확인</label>
          <div class="password-confirm">
            <input
              type="password"
              id="confirm-password"
              placeholder="비밀번호를 다시 입력하세요."
            />
            <img src="../images/eyes.svg" alt="비밀번호 보기" class="eyes" />
          </div>
          <div>
            <button class="btn-sign-up">회원가입</button>
          </div>

          <div class="social-login">
            간편 로그인하기
            <div class="g-k">
              <a href="https://www.google.com" target="_blank"
                ><img src="../images/google.svg" alt="구글 로그인"
              /></a>
              <a href="https://www.kakao.com" target="_blank"
                ><img src="../images/kakao.svg" alt="카카오 로그인"
              /></a>
            </div>
          </div>
          <div id="sign-up">
            <span>이미 회원이신가요?</span>
            <a href="../sign-in/index.html" style="color: #3692ff">로그인</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
