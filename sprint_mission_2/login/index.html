<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <title>판다마켓</title>
  <link href="https://sandollcloud.com" rel="stylesheet">
  <link rel="stylesheet" href="../reset.css">
  <link rel="stylesheet" href="style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FL58603PL3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FL58603PL3');
  </script>
  <script src="script.js"></script>
</head>
<body>
  <main>
    <div class="container_width">
      <a href="../" id="Main_Page">
        <img src="../img/판다 얼굴.svg" alt="Logo" id="Logo">
        <h1>판다마켓</h1>
      </a>
    </div>
    
    <div class="container_length">
      <div class="container_length">
        <div id="Email">
          <h2 id="email_adress">
            이메일
          </h2>
          <input type="text" class="text_section" placeholder="이메일을 입력해주세요">
        </div>
        <div id="Password">
          <h2>
            비밀번호
          </h2>
          <div id="show_word">
            <input type="password" id="Password_text" placeholder="비밀번호를 입력해주세요">
            <img src="img/btn_visibility_on_24px.png">
          </div>
        </div>
        <button>
          로그인
        </button>
        <div class="container_width" id="easy_login">
          <div id="outsied_login">
            <p>
              간편 로그인하기
            </p>
            <div id="component">
              <a href="https://www.google.com/">
                <img src="img/Google.png" alt="Google">
              </a>
              <a href="https://www.kakaocorp.com/page/">
                <img src="img/Kakao.png" alt="Kakao">
              </a>
            </div>
          </div>
        </div>
        <div class="container_width" id="first_login">
          <p>
            판다마켓이 처음이신가요?
          </p>
          <a href="../creat_account/">
            회원가입
          </a>
        </div>

      </div>
    </div>

  </main>
</body>
</html>
