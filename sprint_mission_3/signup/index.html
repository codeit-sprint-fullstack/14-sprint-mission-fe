<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <title>판다마켓</title>
  <link rel="stylesheet" href="../reset.css">
  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FL58603PL3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FL58603PL3');
  </script>
</head>
<body>
  <main>
    <div class="container_width">
      <a href="../" id="Main_Page">
        <img src="../img/판다 얼굴.svg" alt="Logo" id="Logo">
        <h1>판다마켓</h1>
      </a>
    </div>
    
    <div class="container_length">
      <div class="container_length">
        <form id="signupForm">
          <div id="Email">
            <h2>
              이메일
            </h2>
            <input type="text" class="text_section default" id="userEmail" placeholder="이메일을 입력해주세요">
            <div class="failure-message hidden" id="none_email">
              이메일을 입력해주세요.
            </div>
            <div class="failure-message hidden" id="wrong_rule">
              잘못된 이메일 형식입니다.
            </div>
          </div>
          <div id="Nickname">
            <h2>
              닉네임
            </h2>
            <input type="text" class="text_section default" id="userNickname" placeholder="닉네임을 입력해주세요">
            <div class="failure-message hidden" id="none_nickname">
              닉네임을 입력해주세요.
            </div>
          </div>
          <div class="Password">
            <h2>
              비밀번호
            </h2>
            <div id="show_word">
              <input type="password" class="Password_text default" id="userPassword" placeholder="비밀번호를 입력해주세요">
              <img src="img/btn_visibility_on_24px.png">
            </div>
            <div class="failure-message hidden" id="none_password">
              비밀번호를 입력해주세요.
            </div>
            <div class="failure-message hidden" id="wrong_rule_password">
              비밀번호를 8자 이상 입력해주세요.
            </div>
          </div>
          <div class="Password">
            <h2>
              비밀번호 확인
            </h2>
            <div id="show_word2">
              <input type="password" class="Password_text default" id="userPasswordCheck" placeholder="비밀번호를 다시 한 번 입력해주세요">
              <img src="img/btn_visibility_on_24px.png">
            </div>
            <div class="failure-message hidden" id="none_passwordcheck">
              비밀번호를 입력해주세요.
            </div>
            <div class="failure-message hidden" id="wrong_passwordcheck">
              비밀번호가 다릅니다.
            </div>
          </div>
        </form>        
        <button id="signup">
          회원가입
        </button>
        <div class="container_width" id="easy_login">
          <div id="outsied_login">
            <p>
              간편 로그인하기
            </p>
            <div id="component">
              <a href="https://www.google.com/">
                <img src="img/Google.png" alt="Google">
              </a>
              <a href="https://www.kakaocorp.com/page/">
                <img src="img/Kakao.png" alt="Kakao">
              </a>
            </div>
          </div>
        </div>
        <div class="container_width" id="first_login">
          <p>
            이미 회원이신가요?
          </p>
          <a href="../login/">
            로그인
          </a>
        </div>

      </div>
    </div>

  </main>
  <script type="module" src="script.js"></script>
  <div id="infoModal" class="modal">
  <!-- 모달 내용 -->
  <div class="modal-content">
    <p>사용중인 이메일입니다.</p>
    <button id="ok">확인</button>
  </div>
</body>
</html>
