<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="../css/font.css">
	<link rel="stylesheet" href="../css/reset.css">
	<link rel="stylesheet" href="../css/stye.css">
</head>
<body>
	<div class="sign_container sign_up">
		<div id="sign_header">
			<a href="/" class="logo">
				<img src="../img/Group 22.png" alt="">
				판다마켓
			</a>
		</div>
		<div class="sign_inner">
			<div class="input_wrap">
				<label for="email">이메일</label>
				<input type="email" placeholder="이메일을 입력해주세요" name="email" id="email">
			</div>
			<div class="input_wrap">
				<label for="name">닉네임</label>
				<input type="name" placeholder="닉네임을 입력해주세요" name="name" id="name">
			</div>
			<div class="input_wrap">
				<label for="password">비밀번호</label>
				<div class="password_wrap">
					<input type="password" placeholder="비밀번호를 입력해주세요" name="password" id="password">
					<img src="../img/btn_visibility_off_24px.svg" alt="비밀번호 버튼" id="password_toggle_btn">
				</div>
			</div>
			<div class="input_wrap">
				<label for="password_check">비밀번호 확인</label>
				<div class="password_wrap">
					<input type="password" placeholder="비밀번호를 다시 한 번 입력해주세요" name="password_check" id="password_check">
					<img src="../img/btn_visibility_off_24px.svg" alt="비밀번호 버튼" id="password_toggle_btn">
				</div>
			</div>
			<button class="login_btn sign_up" disabled id="login_btn">회원가입</button>
			<div class="social_login">
				<span>간편 로그인하기</span>
				<div class="social_btn_wrap">
					<a class="social_btn" href="https://www.google.com/">
						<img src="../img/ic_google.png" alt="구글 로그인 아이콘">
					</a>
					<a class="social_btn" href='https://www.kakaocorp.com/page/'>
						<img src="../img/ic_kakao.png" alt="카카오 로그인 아이콘">
					</a>
				</div>
			</div>
			<div class="sign_up_wrap">
				이미 회원이신가요? <a href="/login/">로그인</a>
			</div>
		</div>
	</div>
	<script src="../js/sign.js"></script>
</body>
</html>
